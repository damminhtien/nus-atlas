name: Build & deploy (SEO prerender)

# Runs on every push to main — including the content loop's commits — so the prerendered,
# crawlable per-lesson pages + sitemap can never go stale relative to the content. The build
# only happens here in CI; local dev stays zero-build (just open index.html).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Resolve the project-page URL from the repository running this workflow so forks do
      # not canonicalize back to the upstream repository.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # PRs and non-default branches still run the prerender build. Pages deploys only from the default branch.
      # Each repository that deploys must have GitHub Pages enabled.
      DEPLOY_PAGES: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prerender lesson pages + sitemap + robots
        run: node prerender.js
      - name: Configure GitHub Pages
        if: env.DEPLOY_PAGES == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: env.DEPLOY_PAGES == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
