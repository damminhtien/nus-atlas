name: Build & deploy production Pages

# Runs on every push so the CI artifact stays current. GitHub Pages accepts production
# deployments only from the repository's default branch, so only main pushes publish.
on:
  push: {}
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Resolve the project-page URL from the repository running this workflow so forks do
      # not canonicalize back to the upstream repository.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # PRs and feature-branch pushes build for validation; main pushes publish to Pages.
      # Each repository that deploys must have GitHub Pages enabled.
      DEPLOY_PAGES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Check release metadata and cache-busting version
        run: npm run version:check
      - name: Check architecture ownership and source boundaries
        run: npm run check:architecture
      - name: Validate canonical authoring before compilation
        run: npm run content:validate
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Build normalized course packages
        run: npm run content:build
      - name: Validate compiled schema and identity contracts
        run: npm run schemas:validate
      - name: Confirm the compiler did not mutate source
        run: npm run check:source-clean
      - name: Validate content contracts, extraction provenance, LaTeX, contrast drills, and gates
        run: node scripts/validate-content.js && node scripts/validate-extracted.js && node scripts/validate-textbook.js && node scripts/validate-slides.js && node scripts/validate-latex.js && node scripts/validate-latex-render.js && node scripts/validate-contrast-drills.js && node --test tests/*.test.js && node nus-gate.js && node gate.js
      - name: Prerender lesson pages + sitemap + robots
        run: node prerender.js
      - name: Configure GitHub Pages
        if: env.DEPLOY_PAGES == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: env.DEPLOY_PAGES == 'true'
        with:
          path: dist

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke-test production content boundary
        run: npm run smoke:production
